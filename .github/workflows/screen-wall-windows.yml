name: Screen wall Windows x64 preview

on:
  workflow_dispatch:
  push:
    branches: [feature/screen-wall-win]

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  bridge:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install bridge prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: "3.22.3"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: screen-wall-bridge
      - name: Generate bridge in CI
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          sed -i 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp flutter/macos/Runner/bridge_generated.h flutter/ios/Runner/bridge_generated.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: screen-wall-bridge
          retention-days: 7
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h

  topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  windows:
    needs: [bridge, topmost-window]
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: screen-wall-bridge
          path: .
      - uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: "15.0.6"
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        id: flutter
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
      - name: Install upstream Windows engine
        shell: pwsh
        run: |
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { throw 'Flutter precache failed' }
          Invoke-WebRequest https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile engine.zip
          Expand-Archive engine.zip -DestinationPath engine
          $enginePath = Join-Path '${{ steps.flutter.outputs['CACHE-PATH'] }}' 'bin/cache/artifacts/engine/windows-x64-release'
          Copy-Item engine/* -Destination $enginePath -Recurse -Force
      - name: Apply upstream Flutter patch
        shell: bash
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: screen-wall-windows-x64
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install native dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
      - name: Build Windows x64 client
        shell: pwsh
        run: |
          python build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          Move-Item flutter/build/windows/x64/runner/Release rustdesk-screen-wall
      - name: Test new capture settings and Flutter wall
        shell: bash
        run: |
          set -euo pipefail
          FEATURES=$(python build.py --portable --flutter --skip-portable-pack --hwcodec --vram --print-features)
          cargo test --locked --release --lib --features "$FEATURES" low_frequency_preview::tests
          cargo test --locked --release --lib --features "$FEATURES" screen_wall_settings::tests
          cd flutter
          flutter test test/screen_wall_model_test.dart
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: topmostwindow-artifacts-x64
          path: rustdesk-screen-wall
      - name: Include license and corresponding source
        shell: pwsh
        run: |
          Copy-Item LICENCE rustdesk-screen-wall/LICENCE
          Copy-Item docs/screen-wall.md rustdesk-screen-wall/SCREEN-WALL.md
          python res/screen_wall/package_source.py screen-wall-source.zip
          if ($LASTEXITCODE -ne 0) { throw 'Source packaging failed' }
          Get-FileHash rustdesk-screen-wall/rustdesk.exe -Algorithm SHA256 | Format-List | Out-File rustdesk-screen-wall/SHA256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-screen-wall-windows-x64-unsigned
          retention-days: 30
          if-no-files-found: error
          path: rustdesk-screen-wall
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-screen-wall-corresponding-source
          retention-days: 30
          if-no-files-found: error
          path: screen-wall-source.zip
